<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Studio ERP</title>

    <!-- App instalável no celular -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f8fafc" />

    <!-- Tema salvo (claro/escuro, clássico/rosé) aplicado antes de pintar, para não piscar -->
    <script>
        (function () {
            try {
                var t = JSON.parse(localStorage.getItem('studio_erp_tema') || '{}');
                var h = document.documentElement;
                h.dataset.estilo = t.estilo === 'rose' ? 'rose' : 'classico';
                var escuro = t.modo === 'escuro' || (t.modo !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
                if (escuro) h.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Studio ERP" />
</head>

<body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
