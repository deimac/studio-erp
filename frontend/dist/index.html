<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Studio ERP</title>

    <!-- App instalável no celular -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f8fafc" />

    <!-- Tema salvo (claro/escuro, clássico/rosé) aplicado antes de pintar, para não piscar -->
    <script>
        (function () {
            try {
                var t = JSON.parse(localStorage.getItem('studio_erp_tema') || '{}');
                var h = document.documentElement;
                h.dataset.estilo = t.estilo === 'rose' ? 'rose' : 'classico';
                var escuro = t.modo === 'escuro' || (t.modo !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
                if (escuro) h.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Studio ERP" />
  <script type="module" crossorigin src="/assets/index-BIc_buqR.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Dij0-dSt.css">
</head>

<body class="min-h-screen antialiased">
    <div id="root"></div>
    <!-- Proteção para troca de versão: se o estilo ou o código vierem errados
         (o servidor responde a página no lugar do arquivo), busca de novo sem usar o cache. -->
    <script>
        (function () {
            var nova = function (url) { return url.split('?')[0] + '?r=' + Date.now(); };
            window.addEventListener('load', function () {
                var semEstilo = !getComputedStyle(document.documentElement).getPropertyValue('--radius').trim();
                var link = document.querySelector('link[rel="stylesheet"][href*="/assets/"]');
                if (semEstilo && link) {
                    var l = link.cloneNode();
                    l.href = nova(link.href);
                    link.after(l);
                }
            });
            setTimeout(function () {
                var root = document.getElementById('root');
                var script = document.querySelector('script[type="module"][src*="/assets/"]');
                if (root && !root.children.length && script) import(nova(script.src)).catch(function () { location.reload(); });
            }, 6000);
        })();
    </script>
</body>

</html>
